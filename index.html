<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKY Polytechnic College | Tirunelveli - Shape Your Future With Technical Excellence</title>
    <meta name="description" content="AKY Polytechnic College, Tirunelveli. Approved by AICTE, New Delhi & Affiliated to DOTE, Chennai. Offering Diploma in Civil, Mechanical, EEE & ECE." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="icon" type="image/png" href="./assets/aky-logo-N5ZsMpxA.png" />
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.replace(/\/$/, '');
          window.location.replace(basePath + '/#' + decoded + (l.hash || ''));
        }
      }(window.location));
    </script>
    <script type="module" crossorigin src="./assets/index-DGlKXFla.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DpTUdVce.css">
  </head>
  <body class="bg-surface text-on-surface font-sans antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="text/javascript">
      // If raw root index.html is served on GitHub Pages and fails to mount, redirect to pre-built /docs/
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
          var basePath = window.location.pathname.replace(/\/$/, '');
          window.location.replace(basePath + '/docs/' + (window.location.hash || ''));
        }
      }, 600);
    </script>
  </body>
</html>
